      <path d="M27 69L34 69M102 69L108 70M69 68L74 68" stroke="#faf9f5" stroke-width="2"/>
      <path d="M51 78C51 92 32 92 32 79C32 66 51 66 51 78ZM100 80C100 93 80 93 80 80C80 67 100 67 100 80Z" fill="#4d4c48"/>
      <path d="M42 76L42 82M88 78L89 84" stroke="#faf9f5" stroke-width="2"/>
    </g>

    <!-- A small field robot stepping over a rocky obstacle. -->
    <g id="scene-robot" transform="translate(326 37) rotate(-4 58 61)">
      <path d="M6 38C23 5 70 2 101 22C128 44 116 80 91 92C59 111 4 88 6 38Z" fill="#eddfc6" stroke="none"/>
      <path d="M7 107C43 105 90 109 137 107" stroke="#87867f" stroke-width="1.7"/>
      <path d="M78 107L84 96L96 88L110 92L120 106L99 109Z" fill="#c2b08b" stroke-width="2.1"/>
      <path d="M84 96L99 99L96 88M99 99L110 92M99 99L105 108" stroke="#87867f" stroke-width="1.3"/>
      <path d="M62 107L66 100L73 101L78 107Z" fill="#d1cfc5" stroke-width="1.5"/>
      <path d="M119 91L124 86M124 98L131 96M86 114L110 114" stroke="#b0aea5" stroke-width="1.4"/>
      <path d="M42 59L31 78L40 97M75 57L68 74L80 89" stroke="#87867f" stroke-width="5"/>
      <path d="M31 43C47 39 68 39 88 40L90 58C70 65 48 64 31 61Z" fill="#faf9f5"/>
      <path d="M35 45L82 44L82 52L36 55Z" fill="#c2b08b" stroke="none"/>
      <path d="M48 60L53 78L46 101L57 101M83 57L101 69L96 88L106 88" stroke-width="4"/>
      <path d="M88 43L94 28L112 30L111 44L91 47" fill="#faf9f5"/>
      <path d="M100 30L101 20M97 19L105 20" stroke-width="1.7"/>
      <circle cx="106" cy="36" r="2.2" fill="#4d4c48" stroke="none"/>
      <circle cx="47" cy="59" r="4.6" fill="#c96442" stroke-width="1.7"/>
