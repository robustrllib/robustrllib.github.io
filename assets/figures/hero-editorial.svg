      <path d="M297 224C350 210 407 227 452 250C501 224 555 211 605 221L613 369C548 363 499 384 452 398C404 382 349 365 289 371Z" fill="#8b9980"/>
      <path d="M305 219C359 210 412 229 452 249C501 225 551 211 596 216L604 361C550 359 499 376 453 391C410 375 352 356 298 363Z" fill="#e8e6dc" stroke-width="1.8"/>
      <path d="M310 208C356 198 410 218 451 243L451 379C403 354 356 344 304 353Z" fill="#faf9f5"/>
      <path d="M451 243C493 216 546 199 590 207L598 351C548 345 496 359 451 379Z" fill="#faf9f5"/>
      <path d="M444 247C442 286 445 337 445 367M459 246C462 286 457 329 458 366" stroke="#d1cfc5" stroke-width="1.2"/>
      <path d="M310 360C355 354 401 367 441 382M306 366C350 361 395 373 426 382M465 382C509 365 553 357 597 358M479 383C519 369 563 362 600 365" stroke="#b0aea5" stroke-width="1.3"/>
