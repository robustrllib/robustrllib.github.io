<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">A field guide to robust reinforcement learning</title>
  <desc id="desc">An open book with a shield labeled robustRL and a performance curve labeled Evaluation, surrounded by ink drawings of a car in rain, a four-legged robot stepping over rocks, a robot arm reaching for a displaced object, and a maze with a successful route and two wrong turns marked with crosses.</desc>
  <!-- Warm paper, quiet pigment, and deliberately irregular pen contours. -->
  <g stroke="#4d4c48" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
