    <g id="scene-arm" transform="translate(503 38) rotate(6 55 60)">
      <path d="M9 29C28 10 70 1 94 20C118 39 117 73 96 93C74 112 33 102 16 83C4 70-7 48 9 29Z" fill="#dfe4d8" stroke="none"/>
      <path d="M-1 108C37 106 72 110 116 106" stroke="#87867f" stroke-width="1.6"/>
      <path d="M62 91L92 91L98 103L57 103Z" fill="#8b9980"/>
