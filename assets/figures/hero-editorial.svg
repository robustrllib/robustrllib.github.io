      <path d="M13 37C1 39-3 25 7 21C5 10 20 5 28 13C37 3 52 11 51 20C66 19 67 34 55 36C40 38 25 35 13 37Z" fill="#faf9f5"/>
      <path d="M13 47L10 55M29 45L26 56M45 46L42 53M58 43L55 51" stroke="#87867f" stroke-width="2"/>
      <path d="M0 98C34 88 73 90 121 96M-5 104L20 100M93 102L125 103" stroke="#87867f" stroke-width="1.6"/>
      <path d="M24 80L27 66L40 61L52 46L79 46L96 62L109 68L110 81C84 83 49 81 24 80Z" fill="#c96442" stroke="none"/>
