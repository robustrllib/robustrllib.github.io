        <circle cx="32" cy="-31" r="3" fill="#c96442" stroke="none"/>
        <text x="0" y="61" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" font-weight="400" fill="#4d4c48" stroke="none">Evaluation</text>
