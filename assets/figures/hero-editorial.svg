      <path d="M475 374L488 370L490 403L483 398L476 408Z" fill="#c96442" stroke="none"/>
      <!-- Shield, with a slightly offset terracotta impression. -->
      <g transform="translate(377 285) rotate(8)">
        <path d="M-31-33C-15-33-4-39 1-43C13-34 27-30 38-29L35 4C32 23 16 36 3 43C-15 34-28 21-30 3Z" fill="#c96442" stroke="none"/>
        <path d="M-35-37C-19-38-7-42-1-47C12-39 25-34 34-33L33 0C31 20 14 34 0 40C-18 30-33 17-34-2Z" stroke-width="2.3"/>
        <path d="M-15-3L-4 10L17-15" stroke="#faf9f5" stroke-width="4"/>
        <text x="0" y="63" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" font-weight="400" fill="#4d4c48" stroke="none">robustRL</text>
      </g>
      <!-- A measured curve, drawn like a field observation. -->
      <g transform="translate(523 287) rotate(-8)">
        <path d="M-42-37L-43 29L38 29" stroke-width="1.8"/>
        <path d="M-34 13C-23 12-23-11-11-10C0-10-1 6 9 1C18-3 21-26 32-31" stroke="#c96442" stroke-width="3.3"/>
