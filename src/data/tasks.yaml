# The tasks the benchmark covers, for the task-support block of the Shifts section of
# the landing page, below the loop of the six sources (sync_landing.py, `task-support`
# markers).
#
# family   Locomotion | Manipulation | Navigation | Vehicle control | Humanoid | Vision-language-action
# regime   online, offline, or both (which methods were run on it)
# shifts   the shift sources the toolbox offers on this task (keys of shifts.yaml)
# parts    the parts of the paper that report it: 1 library-wide, 2 isolated shifts,
#          3 compound shifts, 4 Isaac Lab and VLA
# media    a short looping render of a trained policy (mp4); provenance of every clip in
#          RobustRLlib_ICLR27/task_renders/PROVENANCE.md (outside the repository)
# poster   for a video: the still shown before it plays
tasks:
  - key: hopper
    name: Hopper-v5
    family: Locomotion
    backend: MuJoCo
    regime: [online, offline]
    parts: [1, 2, 3]
    datasets: [medium, medium-expert, expert]
    axes: [gravity, morphology, actuator gear]
    shifts: [dynamic, observation, action, reward-cost, latency]
    media: assets/tasks/hopper.mp4
    poster: assets/tasks/hopper.jpg
    caption: The one-legged hopper of MuJoCo; the task of the isolated-shift channels.
  - key: walker2d
    name: Walker2d-v5
    family: Locomotion
    backend: MuJoCo
    regime: [online, offline]
    parts: [1]
    datasets: [medium, medium-expert]
    axes: [gravity, morphology, actuator gear]
    shifts: [dynamic, observation, action, reward-cost, latency]
    media: assets/tasks/walker2d.mp4
