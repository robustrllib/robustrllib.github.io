  - slug: dr
    name: DR
    title: Domain Randomization
    regime: online
    family: environment
    base: "SAC / PPO"
    claimed: dynamic
    traits: {rollout: true, adversary: false, model: false}
    budget: "1M environment steps (DR-SAC)"
    tagline: "Simulator parameters resampled every episode from fixed ranges."
    mechanism: |
      Domain randomisation samples simulator parameters from fixed ranges at every episode, so
      that the policy meets a distribution of dynamics during training.

      DR-SAC is the variant used on the standard control tasks. On the locomotion tasks it
      randomises gravity, morphology and actuator gear, each drawn uniformly between
      0.9 and 1.1 times its nominal value at every reset. That is half the width of the
      evaluation grid on the same three axes, so the outer half of the grid lies outside the
      training range. DR-PPO is used on the Isaac Lab tasks.
    ref: {key: tobin2017domain, extra: [peng2018sim]}
    code:
      dir: baselines/dr
      config: robustrllib/configs/algorithm/sac_dr.yaml
      experiment: robustrllib/configs/experiment/dr_hopper_axis_narrow.yaml
      randomization: robustrllib/configs/dr/mujoco_axis_narrow.yaml
      run:
        - "python baselines/dr/train_dr.py -c robustrllib/configs/experiment/dr_hopper_axis_narrow.yaml --seed 0"
        - "# the isolated-shift rows of the paper: the SB3 trainer of the online methods"
        - "python experiments/dr_sac_mujoco_v5/train.py --env Hopper-v5 --seed 0 --total-steps 1000000"
    variants:
      - {label: DR-SAC, part1: [online, DR-SAC], part2: [online, DR-SAC], part3: [[hopper_online, DR-SAC], [pusher, DR-SAC]], backbone: SAC}

